[project]
name = "k-discord-bot"
version = "0.1.0"
description = "K: a modular all-in-one Discord bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "aiohttp>=3.9,<4",
  "discord.py[voice]>=2.7.1,<3",
  "python-dotenv>=1.0,<2",
  "yt-dlp>=2026.3.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
k = "kevin.__main__:main"
kevin = "kevin.__main__:main"
kevin-telegram = "kevin.telegram_main:main"
kevin-both = "kevin.both_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kevin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
